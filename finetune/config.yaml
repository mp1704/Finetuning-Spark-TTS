model_dir: pretrained_models/Spark-TTS-0.5B

data:
  train_jsonl: data/ngochuyen/train_tokens.jsonl
  val_jsonl: data/ngochuyen/val_tokens.jsonl
  max_length: 2048

lora:
  r: 16
  lora_alpha: 32
  # Target both attention and MLP projections in Qwen2.5
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05
  bias: "none"

training:
  output_dir: checkpoints/ngochuyen-demo
  num_train_epochs: 6
  resume_from_checkpoint: checkpoints/ngochuyen-demo/checkpoint-660
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 100
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  bf16: true           # set to false and fp16: true for older GPUs (no bfloat16)
  fp16: false
  gradient_checkpointing: true
  dataloader_num_workers: 4
  remove_unused_columns: false
  optim: adamw_torch_fused

wandb:
  project: sparktts-finetune-33
  run_name: ngochuyen-lora
