model_dir: pretrained_models/Spark-TTS-0.5B

data:
  train_jsonl: data/vieneu/train_tokens.jsonl
  val_jsonl: data/vieneu/val_tokens.jsonl
  max_length: 2048

lora:
  r: 32
  lora_alpha: 64
  # Target both attention and MLP projections in Qwen2.5
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05
  bias: "none"

training:
  output_dir: checkpoints/vieneu-lora
  num_train_epochs: 8
  # No resume — fresh training run
  per_device_train_batch_size: 16   
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 4   # effective batch = 64
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 200
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  bf16: true
  fp16: false
  gradient_checkpointing: true
  dataloader_num_workers: 8
  remove_unused_columns: false
  optim: adamw_torch_fused

wandb:
  project: sparktts-finetune-33
  run_name: vieneu-lora
