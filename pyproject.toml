[project]
name = "sparktts-vi"
version = "0.1.0"
description = "SparkTTS Vietnamese fine-tuning"
requires-python = ">=3.12, <3.13"

dependencies = [
    "einops==0.8.1",
    "einx==0.3.0",
    "numpy==2.2.3",
    "omegaconf==2.3.0",
    "packaging==24.2",
    "safetensors==0.5.2",
    "soundfile==0.12.1",
    "soxr==0.5.0.post1",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "tqdm==4.66.5",
    "transformers==4.46.2",
    "gradio==5.18.0",
]

[project.optional-dependencies]
train = [
    "peft>=0.10.0",
    "datasets>=4.0.0",          # 4.x uses torchcodec by default; we bypass it with decode=False
    "accelerate>=0.27.0",
    "jiwer>=3.0.0",
    "openai-whisper",
    "wandb",
    "python-dotenv",
    "pyvinorm @ git+https://github.com/hoang1007/pyvinorm.git",
    "utmosv2 @ git+https://github.com/sarulab-speech/UTMOSv2.git",
]

[tool.uv]
# uv is the recommended package manager for this project
# Install: curl -LsSf https://astral.sh/uv/install.sh | sh
#
# Quick start:
#   uv sync               # inference only
#   uv sync --extra train # inference + training
